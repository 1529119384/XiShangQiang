spring.application.name=xishangqiang

# 数据库连接配置
spring.datasource.url=jdbc:mysql://localhost:3306/myapp?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=myapp
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:uno/acloud/mapper/*.xml
mybatis.type-aliases-package=uno.acloud.pojo

# 日志配置
logging.level.mapper=debug
logging.level.uno.acloud=info

# JWT配置
jwt.secret=ACloudACloudACloudACloudACloudACloudACloudACloud
jwt.expiration=86400000

# CORS配置
cors.allowed-origins=*
